name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Inclui a validação das migrações SQL em PostgreSQL (PGlite), sem Docker.
      - run: npm test
      - run: npm run build

  # F2.0 — mesma suíte de banco contra o Supabase local REAL (Postgres +
  # Auth + PostgREST + Kong), iniciado pelo CLI no runner (Docker do GitHub).
  # Chaves exibidas por `supabase status` são as de desenvolvimento local,
  # geradas no próprio runner; nenhum segredo do repositório é usado.
  db-integration:
    name: banco · Supabase local real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Desativar telemetria do Supabase CLI
        run: npx --yes supabase@2.122.0 telemetry disable

      - name: Iniciar Supabase local (aplica migrações e seed)
        run: >
          npx --yes supabase@2.122.0 start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Exportar URLs e chaves locais para os testes
        run: |
          npx --yes supabase@2.122.0 status -o env \
            | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/supabase.env"
          sed 's/=.*/=<omitido>/' "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          {
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_API_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - run: npm run test:db:supabase

      - name: Parar Supabase
        if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup

  # F2.0 — smoke e2e + acessibilidade (axe) com o Chrome do runner.
  e2e:
    name: e2e · smoke + acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:e2e

      - name: Publicar relatório (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
